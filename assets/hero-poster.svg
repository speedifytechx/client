<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <!-- Main deep background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A0E21;stop-opacity:1"/>
      <stop offset="45%" style="stop-color:#241019;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#160810;stop-opacity:1"/>
    </linearGradient>
    <!-- Radial glow top-left -->
    <radialGradient id="glowLeft" cx="15%" cy="20%" r="45%">
      <stop offset="0%" style="stop-color:#E7C978;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#E7C978;stop-opacity:0"/>
    </radialGradient>
    <!-- Radial glow bottom-right -->
    <radialGradient id="glowRight" cx="85%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:#7A1636;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#7A1636;stop-opacity:0"/>
    </radialGradient>
    <!-- Center soft glow -->
    <radialGradient id="glowCenter" cx="50%" cy="45%" r="40%">
      <stop offset="0%" style="stop-color:#C7972E;stop-opacity:0.07"/>
      <stop offset="100%" style="stop-color:#C7972E;stop-opacity:0"/>
    </radialGradient>
    <!-- Gold shimmer for petals -->
    <linearGradient id="goldPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E7C978;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#C7972E;stop-opacity:0.6"/>
    </linearGradient>
    <!-- Soft vignette overlay -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.55"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <!-- Glow layers -->
  <rect width="1440" height="900" fill="url(#glowLeft)"/>
  <rect width="1440" height="900" fill="url(#glowRight)"/>
  <rect width="1440" height="900" fill="url(#glowCenter)"/>

  <!-- ── Decorative thin grid lines (very subtle) ── -->
  <g stroke="#E7C978" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="750" x2="1440" y2="750"/>
    <line x1="240" y1="0" x2="240" y2="900"/>
    <line x1="720" y1="0" x2="720" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>

  <!-- ── Large mandala / floral ring — center background ── -->
  <g transform="translate(720,430)" opacity="0.13" filter="url(#softBlur)">
    <!-- Outer thin ring -->
    <circle cx="0" cy="0" r="310" fill="none" stroke="#E7C978" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="290" fill="none" stroke="#E7C978" stroke-width="0.5"/>
    <!-- Petals ring -->
    <g stroke="#E7C978" stroke-width="0.6" fill="none">
      <ellipse rx="18" ry="60" transform="rotate(0)  translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(30) translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(60) translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(90) translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(120) translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(150) translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(180) translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(210) translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(240) translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(270) translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(300) translate(0,-250)"/>
      <ellipse rx="18" ry="60" transform="rotate(330) translate(0,-250)"/>
    </g>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#E7C978" stroke-width="0.5"/>
    <!-- Inner petal ring -->
    <g stroke="#E7C978" stroke-width="0.5" fill="none">
      <ellipse rx="12" ry="40" transform="rotate(15) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(45) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(75) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(105) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(135) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(165) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(195) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(225) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(255) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(285) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(315) translate(0,-155)"/>
      <ellipse rx="12" ry="40" transform="rotate(345) translate(0,-155)"/>
    </g>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#E7C978" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#E7C978" stroke-width="0.6"/>
    <!-- Star center -->
    <polygon points="0,-30 7,-10 28,-10 12,4 18,26 0,14 -18,26 -12,4 -28,-10 -7,-10" fill="none" stroke="#E7C978" stroke-width="0.7"/>
  </g>

  <!-- ── Corner ornament — top left ── -->
  <g transform="translate(60,60)" stroke="#E7C978" stroke-opacity="0.35" fill="none" stroke-width="0.8">
    <path d="M0,0 L120,0"/>
    <path d="M0,0 L0,120"/>
    <path d="M0,0 L60,60"/>
    <circle cx="0" cy="0" r="8" fill="#E7C978" fill-opacity="0.25" stroke-opacity="0.5"/>
    <circle cx="120" cy="0" r="4" fill="#E7C978" fill-opacity="0.2"/>
    <circle cx="0" cy="120" r="4" fill="#E7C978" fill-opacity="0.2"/>
    <path d="M20,0 Q60,20 0,60" stroke-opacity="0.2"/>
  </g>
  <!-- ── Corner ornament — top right ── -->
  <g transform="translate(1380,60)" stroke="#E7C978" stroke-opacity="0.35" fill="none" stroke-width="0.8">
    <path d="M0,0 L-120,0"/>
    <path d="M0,0 L0,120"/>
    <path d="M0,0 L-60,60"/>
    <circle cx="0" cy="0" r="8" fill="#E7C978" fill-opacity="0.25" stroke-opacity="0.5"/>
    <circle cx="-120" cy="0" r="4" fill="#E7C978" fill-opacity="0.2"/>
    <circle cx="0" cy="120" r="4" fill="#E7C978" fill-opacity="0.2"/>
    <path d="M-20,0 Q-60,20 0,60" stroke-opacity="0.2"/>
  </g>
  <!-- ── Corner ornament — bottom left ── -->
  <g transform="translate(60,840)" stroke="#E7C978" stroke-opacity="0.35" fill="none" stroke-width="0.8">
    <path d="M0,0 L120,0"/>
    <path d="M0,0 L0,-120"/>
    <path d="M0,0 L60,-60"/>
    <circle cx="0" cy="0" r="8" fill="#E7C978" fill-opacity="0.25" stroke-opacity="0.5"/>
    <circle cx="120" cy="0" r="4" fill="#E7C978" fill-opacity="0.2"/>
    <circle cx="0" cy="-120" r="4" fill="#E7C978" fill-opacity="0.2"/>
  </g>
  <!-- ── Corner ornament — bottom right ── -->
  <g transform="translate(1380,840)" stroke="#E7C978" stroke-opacity="0.35" fill="none" stroke-width="0.8">
    <path d="M0,0 L-120,0"/>
    <path d="M0,0 L0,-120"/>
    <path d="M0,0 L-60,-60"/>
    <circle cx="0" cy="0" r="8" fill="#E7C978" fill-opacity="0.25" stroke-opacity="0.5"/>
    <circle cx="-120" cy="0" r="4" fill="#E7C978" fill-opacity="0.2"/>
    <circle cx="0" cy="-120" r="4" fill="#E7C978" fill-opacity="0.2"/>
  </g>

  <!-- ── Floating gold flower petals — left side ── -->
  <g opacity="0.18" fill="url(#goldPetal)" filter="url(#softBlur)">
    <ellipse cx="110" cy="200" rx="8" ry="22" transform="rotate(-30,110,200)"/>
    <ellipse cx="130" cy="185" rx="8" ry="22" transform="rotate(10,130,185)"/>
    <ellipse cx="95"  cy="220" rx="8" ry="22" transform="rotate(-70,95,220)"/>
    <ellipse cx="145" cy="210" rx="7" ry="18" transform="rotate(50,145,210)"/>
    <ellipse cx="120" cy="240" rx="7" ry="18" transform="rotate(-10,120,240)"/>
    <circle cx="120" cy="210" r="6" fill="#E7C978" fill-opacity="0.4"/>
  </g>
  <!-- ── Floating petals — right side ── -->
  <g opacity="0.18" fill="url(#goldPetal)" filter="url(#softBlur)">
    <ellipse cx="1310" cy="650" rx="8" ry="22" transform="rotate(25,1310,650)"/>
    <ellipse cx="1330" cy="635" rx="8" ry="22" transform="rotate(65,1330,635)"/>
    <ellipse cx="1295" cy="670" rx="8" ry="22" transform="rotate(-15,1295,670)"/>
    <ellipse cx="1345" cy="660" rx="7" ry="18" transform="rotate(-55,1345,660)"/>
    <ellipse cx="1320" cy="690" rx="7" ry="18" transform="rotate(40,1320,690)"/>
    <circle cx="1320" cy="660" r="6" fill="#E7C978" fill-opacity="0.4"/>
  </g>
  <!-- ── Scattered small sparkle dots ── -->
  <g fill="#E7C978">
    <circle cx="200"  cy="100"  r="1.5" opacity="0.5"/>
    <circle cx="380"  cy="60"   r="1"   opacity="0.35"/>
    <circle cx="560"  cy="130"  r="2"   opacity="0.4"/>
    <circle cx="900"  cy="80"   r="1.5" opacity="0.45"/>
    <circle cx="1100" cy="50"   r="1"   opacity="0.3"/>
    <circle cx="1260" cy="120"  r="2"   opacity="0.4"/>
    <circle cx="150"  cy="500"  r="1.5" opacity="0.3"/>
    <circle cx="1300" cy="300"  r="1.5" opacity="0.3"/>
    <circle cx="400"  cy="820"  r="1"   opacity="0.3"/>
    <circle cx="1050" cy="800"  r="2"   opacity="0.35"/>
    <circle cx="700"  cy="160"  r="1.5" opacity="0.4"/>
    <circle cx="820"  cy="750"  r="1.5" opacity="0.3"/>
    <!-- diamond sparkle shapes -->
    <polygon points="300,180  303,185  300,190  297,185" opacity="0.45"/>
    <polygon points="1150,200 1153,205 1150,210 1147,205" opacity="0.4"/>
    <polygon points="500,700  503,705  500,710  497,705" opacity="0.35"/>
    <polygon points="950,120  953,125  950,130  947,125" opacity="0.4"/>
  </g>

  <!-- ── Thin gold horizontal rule lines ── -->
  <line x1="480" y1="370" x2="660" y2="370" stroke="#E7C978" stroke-opacity="0.3" stroke-width="0.7"/>
  <line x1="780" y1="370" x2="960" y2="370" stroke="#E7C978" stroke-opacity="0.3" stroke-width="0.7"/>
  <circle cx="720" cy="370" r="4" fill="none" stroke="#E7C978" stroke-opacity="0.4" stroke-width="0.8"/>
  <circle cx="720" cy="370" r="1.5" fill="#E7C978" fill-opacity="0.5"/>

  <!-- ── Studio silhouette illustration — subtle bride outline ── -->
  <g transform="translate(820,130)" opacity="0.07" fill="#E7C978">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="28" ry="34"/>
    <!-- Veil flowing right -->
    <path d="M22,-20 Q80,-60 120,40 Q100,80 60,100 Q30,50 22,30Z"/>
    <!-- Shoulders / bodice -->
    <path d="M-30,34 Q-55,80 -45,160 L45,160 Q55,80 30,34Z"/>
    <!-- Skirt flare -->
    <path d="M-45,160 Q-90,260 -110,380 L110,380 Q90,260 45,160Z"/>
    <!-- Left arm -->
    <path d="M-30,60 Q-70,90 -80,150 Q-60,160 -45,160 Q-35,110 -30,80Z"/>
    <!-- Right arm with bouquet hint -->
    <path d="M30,60 Q70,90 80,150 Q60,160 45,160 Q35,110 30,80Z"/>
    <!-- Bouquet circles -->
    <circle cx="82" cy="148" r="10"/>
    <circle cx="96" cy="140" r="8"/>
    <circle cx="90" cy="160" r="7"/>
  </g>

  <!-- ── Decorative swirls left edge ── -->
  <g stroke="#E7C978" stroke-opacity="0.12" fill="none" stroke-width="0.8">
    <path d="M0,300 Q50,250 80,300 Q110,350 60,400 Q30,430 0,400"/>
    <path d="M0,400 Q40,370 70,420 Q90,460 50,490 Q20,510 0,490"/>
    <path d="M0,490 Q45,460 75,510 Q95,550 55,580"/>
  </g>
  <!-- ── Decorative swirls right edge ── -->
  <g stroke="#E7C978" stroke-opacity="0.12" fill="none" stroke-width="0.8">
    <path d="M1440,300 Q1390,250 1360,300 Q1330,350 1380,400 Q1410,430 1440,400"/>
    <path d="M1440,400 Q1400,370 1370,420 Q1350,460 1390,490 Q1420,510 1440,490"/>
    <path d="M1440,490 Q1395,460 1365,510 Q1345,550 1385,580"/>
  </g>

  <!-- ── Thin border frame ── -->
  <rect x="24" y="24" width="1392" height="852" fill="none" stroke="#E7C978" stroke-opacity="0.18" stroke-width="0.8"/>
  <rect x="32" y="32" width="1376" height="836" fill="none" stroke="#E7C978" stroke-opacity="0.10" stroke-width="0.5"/>

  <!-- Vignette on top -->
  <rect width="1440" height="900" fill="url(#vignette)"/>

  <!-- ── Central text content ── -->
  <!-- Studio name -->
  <text x="720" y="395" font-family="Georgia,serif" font-size="62" font-weight="600" fill="#fff" fill-opacity="0.95" text-anchor="middle" letter-spacing="2" filter="url(#glow)">Elite Bridal Studio</text>
  <!-- Tagline rule + text -->
  <text x="720" y="440" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#E7C978" fill-opacity="0.85" text-anchor="middle" letter-spacing="5">MAKEUP &amp; SKIN CARE · OOTY</text>
  <!-- Sub line -->
  <text x="720" y="480" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#fff" fill-opacity="0.65" text-anchor="middle" letter-spacing="1">Where every bride feels elite</text>

  <!-- Bottom subtle badge -->
  <text x="720" y="855" font-family="Arial,sans-serif" font-size="11" fill="#E7C978" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">+91 99448 16444</text>
</svg>
